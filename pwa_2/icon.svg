<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- flat rounded-square, modern app-icon silhouette -->
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- minimalist rising line chart: three segments + node dots, single weight -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="128,340 216,268 300,312 384,180"/>
  </g>
  <!-- endpoint node (accent) -->
  <circle cx="384" cy="180" r="24" fill="#FFFFFF"/>
  <circle cx="384" cy="180" r="10" fill="#8B5CF6"/>
  <!-- subtle baseline -->
  <line x1="128" y1="384" x2="384" y2="384" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round"/>
</svg>
